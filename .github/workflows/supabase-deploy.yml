name: Supabase deploy

# main 上的迁移或场馆目录有变化时推到生产库；也可以在 Actions 页面手动运行
on:
  push:
    branches: [ main ]
    paths:
      - "supabase/migrations/**"
      - "supabase/seed.sql"
  workflow_dispatch:

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      # link 和 push 必须在同一个 job：link 会记下 IPv4 连接池地址（GitHub 的机器没有 IPv6）
      - name: Link project
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then echo "未配置 Supabase，跳过"; exit 0; fi
          supabase link --project-ref "$PROJECT_REF"

      - name: Preview changes
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.PROJECT_REF != ''
        run: supabase db push --dry-run

      - name: Apply migrations
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.PROJECT_REF != ''
        run: supabase db push

      # 场馆目录每次都显式同步：db push --include-seed 只在第一次执行 seed.sql，之后文件变了也只更新记账的 hash。
      # seed.sql 可以重复执行（按 id 新增或更新，目录里删掉的进审核队列）
      - name: Sync venue catalog
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.PROJECT_REF != ''
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: psql "$(cat supabase/.temp/pooler-url)" -v ON_ERROR_STOP=1 --single-transaction -q -f supabase/seed.sql
