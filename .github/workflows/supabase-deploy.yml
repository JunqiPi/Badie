name: Supabase deploy

# main 上的迁移有变化时推到生产库；也可以在 Actions 页面手动运行
on:
  push:
    branches: [ main ]
    paths:
      - "supabase/migrations/**"
      - "supabase/seed.sql"
  workflow_dispatch:

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      # link 和 push 必须在同一个 job：link 会记下 IPv4 连接池地址（GitHub 的机器没有 IPv6）
      - name: Link project
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then echo "未配置 Supabase，跳过"; exit 0; fi
          supabase link --project-ref "$PROJECT_REF"

      - name: Preview changes
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.PROJECT_REF != ''
        run: supabase db push --dry-run --include-seed

      # seed.sql 只会在第一次执行（CLI 按文件 hash 记账）；以后的场馆数据更新走单独的导入脚本
      - name: Apply migrations and first-time venue import
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.PROJECT_REF != ''
        run: supabase db push --include-seed
