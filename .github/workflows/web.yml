name: Web CI

on:
  push:
    branches: [ main, "claude/**" ]
    paths:
      - "web/**"
      - "supabase/**"
      - "Badie-iOS/Badie/Resources/*.json"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - "supabase/**"
      - "Badie-iOS/Badie/Resources/*.json"
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Check, build & deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test

      # 我们自己整理的球馆不放在公开仓库里：构建前从线上数据库导出（只读，不打印内容）；没配 Supabase 时跳过
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: Export collected venues
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        working-directory: .
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ] || [ -z "$PGPASSWORD" ]; then echo "未配置 Supabase，跳过"; exit 0; fi
          supabase link --project-ref "$PROJECT_REF" > /dev/null
          psql "$(cat supabase/.temp/pooler-url)" -At -v ON_ERROR_STOP=1 -f supabase/scripts/export_collected_venues.sql > supabase/data/badie-venues.json
          python3 -c "import json; print(len(json.load(open('supabase/data/badie-venues.json'))['venues']), 'collected venues')"

      # 安卓 App 的安装包：从最新的安卓发布（android-release.yml 发的 android-v… Release）下载到 public/android/，
      # 网站上就是 /android/badie.apk 和 /android/version.json，构建时 astro.config.ts 读到它才显示下载。
      # 还没有发布时跳过；查发布出错时停下（不然部署出去的网站会少了安装包，App 的更新检查也会找不到）
      - name: Android app from the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '[.[] | select(.draft | not) | select(.tag_name | startswith("android-v"))] | sort_by(.created_at) | last | .tag_name // empty')
          if [ -z "$tag" ]; then echo "还没有安卓的发布，网站不放安装包"; exit 0; fi
          mkdir -p public/android
          gh release download "$tag" -R "$GITHUB_REPOSITORY" -p badie.apk -p android-version.json -D public/android --clobber
          mv public/android/android-version.json public/android/version.json
          expected=$(jq -r .sha256 public/android/version.json)
          actual=$(sha256sum public/android/badie.apk | cut -d' ' -f1)
          if [ "$expected" != "$actual" ]; then echo "::error::$tag 的 badie.apk 和 version.json 里的 SHA-256 对不上"; exit 1; fi
          echo "安装包：$tag（$(stat -c %s public/android/badie.apk) 字节）"

      # 这几个值都可以公开，放在仓库 Variables（不是 Secrets）
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          PUBLIC_VAPID_KEY: ${{ vars.VAPID_PUBLIC_KEY }}

      # 只有 main 部署；没配 Cloudflare 时跳过
      - name: Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "未配置 Cloudflare，跳过部署"; exit 0; fi
          npx --yes wrangler@4.151.1 pages project list | grep -qw badie \
            || npx --yes wrangler@4.151.1 pages project create badie --production-branch main
          npx --yes wrangler@4.151.1 pages deploy dist --project-name badie --branch main

  app-e2e:
    name: App end-to-end (local Supabase)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Start Supabase (database, auth, REST, mail)
        run: supabase start -x studio,imgproxy,storage-api,realtime,edge-runtime,logflare,vector,supavisor,postgres-meta

      - name: Build and serve the site against it
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          export PUBLIC_SUPABASE_URL=http://127.0.0.1:54321
          export PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(supabase status -o env | grep '^PUBLISHABLE_KEY=' | cut -d= -f2- | tr -d '"')
          # 测试用的推送公钥（公开的，只用来让推送开关出现）
          export PUBLIC_VAPID_KEY=BIFxl9ZRcDpibxWeWst3467mT2VdDX1LLykAwAG4VZbwkP05i4RTVshVASDCz-fFeUzhOyQy3w1lDTA0-54cXL4
          npm run build
          # 和线上一样用 Cloudflare Pages 的本地服务器，_redirects 和 _headers 都生效
          WRANGLER_SEND_METRICS=false npx --yes wrangler@4.151.1 pages dev dist --ip 127.0.0.1 --port 4321 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:4321/app/ >/dev/null && break; sleep 1; done

      - name: Run end-to-end tests
        working-directory: web
        run: npm run e2e
