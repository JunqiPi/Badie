name: Web CI

on:
  push:
    branches: [ main, "claude/**" ]
    paths:
      - "web/**"
      - "supabase/**"
      - "Badie-iOS/Badie/Resources/*.json"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - "supabase/**"
      - "Badie-iOS/Badie/Resources/*.json"
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Check, build & deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test

      # 这几个值都可以公开，放在仓库 Variables（不是 Secrets）
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}

      # 只有 main 部署；没配 Cloudflare 时跳过
      - name: Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "未配置 Cloudflare，跳过部署"; exit 0; fi
          npx --yes wrangler@4.151.1 pages project list | grep -qw badie \
            || npx --yes wrangler@4.151.1 pages project create badie --production-branch main
          npx --yes wrangler@4.151.1 pages deploy dist --project-name badie --branch main

  app-e2e:
    name: App end-to-end (local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Start Supabase (database, auth, REST, mail)
        run: supabase start -x studio,imgproxy,storage-api,realtime,edge-runtime,logflare,vector,supavisor,postgres-meta

      - name: Build and serve the site against it
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          export PUBLIC_SUPABASE_URL=http://127.0.0.1:54321
          export PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(supabase status -o env | grep '^PUBLISHABLE_KEY=' | cut -d= -f2- | tr -d '"')
          npm run build
          # 和线上一样用 Cloudflare Pages 的本地服务器，_redirects 和 _headers 都生效
          WRANGLER_SEND_METRICS=false npx --yes wrangler@4.151.1 pages dev dist --ip 127.0.0.1 --port 4321 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:4321/app/ >/dev/null && break; sleep 1; done

      - name: Run end-to-end tests
        working-directory: web
        run: npm run e2e
