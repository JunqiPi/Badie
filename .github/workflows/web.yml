name: Web CI

on:
  push:
    branches: [ main, "claude/**" ]
    paths:
      - "web/**"
      - "Badie-iOS/Badie/Resources/*.json"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - "Badie-iOS/Badie/Resources/*.json"
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Check & build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}

      # 只有 main 部署；没配 Cloudflare 密钥时跳过（需要 Secrets：CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID，Variables：SITE_URL）
      - name: Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "未配置 Cloudflare，跳过部署"; exit 0; fi
          npx --yes wrangler@4.151.1 pages deploy dist --project-name badie --branch main
