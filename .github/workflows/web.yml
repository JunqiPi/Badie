name: Web CI

on:
  push:
    branches: [ main, "claude/**" ]
    paths:
      - "web/**"
      - "Badie-iOS/Badie/Resources/*.json"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - "Badie-iOS/Badie/Resources/*.json"
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Check & build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
