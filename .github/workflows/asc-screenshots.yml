name: Upload App Store screenshots

# 把 “App Store screenshots” 工作流跑出来的截图传到 App Store Connect 的某个版本上（替换这个版本各语言原有的截图）。
# mode = list 只看不改；upload 才真的传。这个文件有改动时在开发分支上自动跑一次（按下面的默认值），也可以手动运行。
# 动的是苹果账号：改成 upload 之前先问用户
on:
  push:
    branches: [ "claude/**" ]
    paths: [ ".github/workflows/asc-screenshots.yml" ]
  workflow_dispatch:
    inputs:
      mode:
        description: list = 只看；upload = 上传并替换
        default: list
      version:
        description: 版本号
        default: "1.0.3"
      run_id:
        description: 截图来自 “App Store screenshots” 的哪一次运行（运行页面网址里的数字）
        default: "42878332686"

permissions:
  contents: read
  actions: read

env:
  MODE: ${{ inputs.mode || 'list' }}
  VERSION: ${{ inputs.version || '1.0.3' }}
  RUN_ID: ${{ inputs.run_id || '42878332686' }}

jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Download screenshots
        if: env.MODE == 'upload'
        uses: actions/download-artifact@v4
        with:
          pattern: app-store-screenshots-*
          path: shots
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ github.token }}
      - name: ${{ env.MODE }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          (umask 077; printf '%s\n' "$ASC_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey.p8")
          trap 'rm -f "$RUNNER_TEMP/AuthKey.p8"' EXIT
          cd Badie-iOS/scripts
          if [ "$MODE" = "upload" ]; then
            ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8" python3 asc_screenshots.py upload "$VERSION" "$GITHUB_WORKSPACE/shots"
          else
            ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8" python3 asc_screenshots.py list "$VERSION"
          fi
