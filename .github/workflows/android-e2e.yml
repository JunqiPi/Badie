name: Android E2E

# 在 Android 模拟器上点真的界面，连本机的 Supabase：注册登录、聊天、推送、各处自动刷新。
# 测试在 Badie-Android/app/src/androidTest，怎么一段段跑见 Badie-Android/e2e/run.sh
# 同一套测试跑两遍：调试包（debug），和照正式包一样用 R8 压缩过的包（minified，-Pbadie.minify=true），
# 压缩把 App 弄坏了（类被删、名字改了）也能发现。另外 live-apk 把网站上正在发的安装包装上打开看一眼（不登录）
on:
  push:
    branches: [ main, "claude/**" ]
    paths:
      - "Badie-Android/**"
      - "Badie-iOS/Badie/Localizable.xcstrings"
      - "supabase/**"
      - ".github/workflows/android-e2e.yml"
  workflow_dispatch:

concurrency:
  group: android-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Emulator end-to-end (${{ matrix.build }}, local Supabase)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build: [ debug, minified ]
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 模拟器要硬件加速
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.121.0

      - name: Start Supabase (database, auth, REST, mail)
        run: |
          supabase start -x studio,imgproxy,logflare,vector,supavisor,postgres-meta,edge-runtime,realtime
          supabase status -o env > "$RUNNER_TEMP/status.env"
          publishable=$(grep '^PUBLISHABLE_KEY=' "$RUNNER_TEMP/status.env" | cut -d= -f2- | tr -d '"')
          service=$(grep '^SERVICE_ROLE_KEY=' "$RUNNER_TEMP/status.env" | cut -d= -f2- | tr -d '"')
          rm "$RUNNER_TEMP/status.env"
          echo "::add-mask::$service"
          {
            echo "SUPABASE_URL=http://127.0.0.1:54321"
            echo "PUBLISHABLE_KEY=$publishable"
            echo "SERVICE_ROLE_KEY=$service"
          } >> "$GITHUB_ENV"

      # 推送：数据库有新通知时用 pg_net 叫 /functions/v1/send-push（地址和暗号在 Vault），推送服务用 FCM_SERVICE_ACCOUNT 发给 Firebase。
      # 没配这个 Secret 时推送服务照样起（别的推送照常排队），推送的测试跳过
      - name: Serve the push function
        env:
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
        run: |
          secret=$(openssl rand -hex 24)
          echo "::add-mask::$secret"
          umask 077
          {
            echo "PUSH_SECRET=$secret"
            if [ -n "$FCM_SERVICE_ACCOUNT" ]; then printf "FCM_SERVICE_ACCOUNT='%s'\n" "$(printf '%s' "$FCM_SERVICE_ACCOUNT" | jq -c .)"; fi
          } > "$RUNNER_TEMP/functions.env"
          # 数据库容器里，网关的地址是容器名
          psql postgresql://postgres:postgres@127.0.0.1:54322/postgres -qc \
            "select vault.create_secret('http://supabase_kong_badie:8000', 'project_url'); select vault.create_secret('$secret', 'push_secret');" >/dev/null
          supabase functions serve --env-file "$RUNNER_TEMP/functions.env" > "$RUNNER_TEMP/functions.log" 2>&1 &
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:54321/functions/v1/send-push || true)
            [ "$code" = 403 ] && break
            sleep 2
          done
          echo "send-push: $code"
          if [ -n "$FCM_SERVICE_ACCOUNT" ]; then echo "PUSH=1" >> "$GITHUB_ENV"; else echo "PUSH=0" >> "$GITHUB_ENV"; echo "::notice::没有配 FCM_SERVICE_ACCOUNT，推送的测试会跳过"; fi

      # 调试包连本机的 Supabase（模拟器里电脑的地址是 10.0.2.2），见 app/build.gradle.kts。
      # minified：同一个调试包按正式包的规则压缩；它不可调试，会去网站查新版本，所以版本号给到最大，不弹更新提示
      - name: Build the app and the tests against it
        working-directory: Badie-Android
        env:
          BUILD: ${{ matrix.build }}
        run: |
          extra=()
          if [ "$BUILD" = minified ]; then
            export BADIE_VERSION_CODE=2100000000
            extra=(-Pbadie.minify=true)
          fi
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --console=plain -Pbadie.supabaseUrl=http://10.0.2.2:54321 "-Pbadie.supabaseKey=$PUBLISHABLE_KEY" "${extra[@]}"
          # 压缩包：测试 APK 调到的类和方法在压缩后的 App 里都要在，不然装上去每个测试都是 NoSuchMethodError
          if [ "$BUILD" = minified ]; then
            dexdump=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/dexdump
            python3 -I e2e/check-test-refs.py "$dexdump" app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          fi

      # Google APIs 的系统镜像带 Google Play 服务，FCM 才能用
      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          E2E_OUT: ${{ github.workspace }}/e2e-output
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          script: bash Badie-Android/e2e/run.sh

      # 只在没通过时传：截图、录屏、界面结构、logcat、推送服务的日志（都不含密钥；不传数据库）
      # 压缩包的堆栈是混淆过的名字：映射表一起传，用 R8 的 retrace 还原
      - name: Collect the push function log
        if: failure()
        run: |
          cp "$RUNNER_TEMP/functions.log" e2e-output/ 2>/dev/null || true
          cp Badie-Android/app/build/outputs/mapping/debug/mapping.txt e2e-output/ 2>/dev/null || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: android-e2e-${{ matrix.build }}
          path: e2e-output
          if-no-files-found: ignore
          retention-days: 7

  # 网站上正在发的安装包：装上、打开、看到欢迎页、点进邮箱登录那一页，不崩（不登录正式后端）。脚本是 Badie-Android/e2e/live-apk.sh
  live-apk:
    name: Live APK from badie.rsvp opens
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # 和 version.json 里的 SHA-256 对一下，确认下到的就是在发的那一版
      - name: Download the APK
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/badie.apk" https://badie.rsvp/android/badie.apk
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/version.json" https://badie.rsvp/android/version.json
          jq -c '{versionName, versionCode, size}' "$RUNNER_TEMP/version.json"
          expected=$(jq -r .sha256 "$RUNNER_TEMP/version.json")
          actual=$(sha256sum "$RUNNER_TEMP/badie.apk" | cut -d' ' -f1)
          [ "$expected" = "$actual" ] || { echo "SHA-256 对不上：$actual"; exit 1; }
          echo "APK=$RUNNER_TEMP/badie.apk" >> "$GITHUB_ENV"

      - name: Install and open it on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          E2E_OUT: ${{ github.workspace }}/live-output
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          script: bash Badie-Android/e2e/live-apk.sh "$APK"

      # 截图和 logcat（没登录，不含密钥）
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-live-apk
          path: live-output
          if-no-files-found: ignore
          retention-days: 7
