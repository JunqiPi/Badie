name: Android release

# 打 Google Play 要的正式包（AAB，用上传密钥签名），作为产物上传；下载后手动传到 Play 管理中心。
# 只能手动运行：Actions → Android release → Run workflow（一般选 main）。步骤见 Badie-Android/docs/RELEASE.md。
#
# 要先在 GitHub → Settings → Secrets and variables → Actions 加四个 secret（用户自己填，不要发到聊天里）：
#   ANDROID_UPLOAD_KEYSTORE_BASE64   上传密钥库（.jks）的 base64
#   ANDROID_UPLOAD_STORE_PASSWORD    密钥库密码
#   ANDROID_UPLOAD_KEY_ALIAS         密钥别名
#   ANDROID_UPLOAD_KEY_PASSWORD      密钥密码
#
# 仓库是公开的：这里不打印任何密钥，也不打印签名证书的信息（里面有真名）。AAB 里没有密钥，可以作为产物上传。

on:
  workflow_dispatch:

concurrency:
  group: android-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bundle:
    name: Signed AAB
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: Badie-Android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 只读缓存：正式包的构建不往缓存里写东西
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Check secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE_BASE64" ] || missing="$missing ANDROID_UPLOAD_KEYSTORE_BASE64"
          [ -n "$STORE_PASSWORD" ] || missing="$missing ANDROID_UPLOAD_STORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || missing="$missing ANDROID_UPLOAD_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ] || missing="$missing ANDROID_UPLOAD_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::GitHub Secrets 里缺:$missing（见 Badie-Android/docs/RELEASE.md）"
            exit 1
          fi

      # 和平时的 Android CI 一样先跑测试和检查，过了才打包
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Lint (release)
        run: ./gradlew :app:lintRelease --console=plain

      # 密钥库解到临时目录（任务结束就删），密码只经环境变量交给 Gradle。
      # --no-configuration-cache：签名用的密码不写进 Gradle 的配置缓存
      - name: Build signed AAB
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          BADIE_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          BADIE_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          BADIE_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          # Play 要求每次上传的 versionCode 都更大：用这个工作流的运行序号（每跑一次加 1）
          BADIE_VERSION_CODE: ${{ github.run_number }}
        run: |
          set +x
          export BADIE_UPLOAD_KEYSTORE="$RUNNER_TEMP/upload.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$BADIE_UPLOAD_KEYSTORE"
          unset KEYSTORE_BASE64
          ./gradlew :app:bundleRelease --console=plain --no-configuration-cache
          rm -f "$BADIE_UPLOAD_KEYSTORE"

      # 确认真的签上了（只看结果，不打印证书信息）
      - name: Verify signature
        run: |
          aab=app/build/outputs/bundle/release/app-release.aab
          if jarsigner -verify "$aab" 2>&1 | grep -q "jar verified"; then
            echo "AAB 已签名"
          else
            echo "::error::AAB 没有签名"
            exit 1
          fi
          versionName=$(grep -m1 'versionName = ' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          echo "### Badie ${versionName}（versionCode ${{ github.run_number }}）" >> "$GITHUB_STEP_SUMMARY"
          echo "下载产物 badie-release-aab，传到 Play 管理中心。" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: badie-release-aab
          path: |
            Badie-Android/app/build/outputs/bundle/release/app-release.aab
            Badie-Android/app/build/outputs/mapping/release/mapping.txt
          retention-days: 30
