name: App Store screenshots

# 手动运行：在最新的 iPhone Pro Max（6.9 英寸，1320 × 2868）和 Pro（6.3 英寸，1206 × 2622，Apple 要求至少一张）模拟器上
# 截 10 种语言的宣传页并配上标题（文字在 scripts/store_captions.json），下载后按语言上传到 App Store Connect
on:
  workflow_dispatch:

jobs:
  screenshots:
    name: ${{ matrix.size }} screenshots
    runs-on: macos-26
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        # 6.9 英寸（1320 × 2868）和 6.3 英寸（1206 × 2622，Apple 要求至少一张）
        size: [6.9-inch, 6.3-inch]
    defaults:
      run:
        working-directory: Badie-iOS
    steps:
      - uses: actions/checkout@v4

      - name: Pick simulator
        id: sim
        run: echo "udid=$(python3 scripts/pick_simulator.py ${{ matrix.size == '6.9-inch' && '--max' || '' }})" >> "$GITHUB_OUTPUT"

      - name: Build app
        timeout-minutes: 25
        run: |
          xcodebuild build -project Badie.xcodeproj -scheme Badie -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO > build.log 2>&1 || { grep -E "error:" build.log | sort -u | head -50; exit 1; }

      - name: Capture and frame screenshots
        # 10 种语言 × 8 张
        timeout-minutes: 45
        run: STORE=1 bash scripts/ci_screenshots.sh "${{ steps.sim.outputs.udid }}" build/Build/Products/Debug-iphonesimulator/Badie.app store-screenshots/${{ matrix.size }}

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: app-store-screenshots-${{ matrix.size }}
          path: Badie-iOS/store-screenshots
          retention-days: 30
