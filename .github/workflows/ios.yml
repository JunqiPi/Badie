name: iOS CI

on:
  push:
    branches: [ main, "claude/**" ]
    paths:
      - "Badie-iOS/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "Badie-iOS/**"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, test & screenshots
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: Badie-iOS
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Pick iPhone simulator
        id: sim
        run: echo "udid=$(python3 scripts/pick_simulator.py)" >> "$GITHUB_OUTPUT"

      - name: Build app and tests
        id: build
        timeout-minutes: 25
        run: |
          set +e
          xcodebuild build-for-testing \
            -project Badie.xcodeproj \
            -scheme Badie \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO > build.log 2>&1
          STATUS=$?
          echo "----- compiler errors -----"
          grep -E "error:" build.log | sort -u | head -300
          echo "----- tail -----"
          tail -15 build.log
          exit $STATUS

      - name: Package simulator app
        if: steps.build.outcome == 'success'
        run: ditto -c -k --sequesterRsrc --keepParent build/Build/Products/Debug-iphonesimulator/Badie.app Badie-sim.zip

      - name: Upload simulator app
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: simulator-app
          path: Badie-iOS/Badie-sim.zip
          retention-days: 14

      # 设置了 APPETIZE_API_TOKEN（Secret）时，把这次构建更新到 Appetize 在线试玩；
      # APPETIZE_PUBLIC_KEY（Variable）指定要更新的那个 App，保持试玩链接不变
      - name: Update Appetize preview
        if: steps.build.outcome == 'success' && github.event_name == 'push'
        env:
          APPETIZE_API_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
          APPETIZE_PUBLIC_KEY: ${{ vars.APPETIZE_PUBLIC_KEY }}
        run: |
          if [ -z "$APPETIZE_API_TOKEN" ]; then echo "未设置 APPETIZE_API_TOKEN，跳过"; exit 0; fi
          curl -sS --fail -X POST "https://api.appetize.io/v1/apps${APPETIZE_PUBLIC_KEY:+/$APPETIZE_PUBLIC_KEY}" \
            -H "X-API-KEY: $APPETIZE_API_TOKEN" -F "file=@Badie-sim.zip" -F "platform=ios" \
            | python3 -c 'import sys, json; print("https://appetize.io/app/" + json.load(sys.stdin)["publicKey"])'

      - name: Run unit tests
        id: test
        timeout-minutes: 15
        run: |
          set +e
          xcodebuild test-without-building \
            -project Badie.xcodeproj \
            -scheme Badie \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 60 \
            -testLanguage zh-Hans -testRegion CN \
            CODE_SIGNING_ALLOWED=NO > test.log 2>&1
          STATUS=$?
          echo "----- failures -----"
          grep -E "error:|: failed|Test Case .* failed|Executed [0-9]+ tests" test.log | sort -u | head -200
          echo "----- tail -----"
          tail -15 test.log
          exit $STATUS

      # 从源码提取全部待翻译文案（同时同步 String Catalog），供翻译使用
      - name: Export localizations
        if: always() && steps.build.outcome == 'success'
        timeout-minutes: 15
        run: |
          xcodebuild -exportLocalizations -project Badie.xcodeproj -localizationPath localizations \
            -exportLanguage en > export.log 2>&1 || { tail -30 export.log; exit 1; }
          mkdir -p localizations/catalogs
          find Badie -name "*.xcstrings" -exec cp {} localizations/catalogs/ \;

      - name: Upload localizations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: localizations
          path: Badie-iOS/localizations
          if-no-files-found: ignore
          retention-days: 7

      - name: Capture screenshots
        if: always() && steps.build.outcome == 'success'
        # 79 张约 14 分钟；模拟器慢的时候安装和预热还要多花近 10 分钟
        timeout-minutes: 35
        run: bash scripts/ci_screenshots.sh "${{ steps.sim.outputs.udid }}" build/Build/Products/Debug-iphonesimulator/Badie.app screenshots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: Badie-iOS/screenshots
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: |
            Badie-iOS/build.log
            Badie-iOS/test.log
          if-no-files-found: ignore
          retention-days: 7
