name: Supabase keep-alive

# 免费版项目 7 天没有活动会被暂停；每天读一行公开数据，保持活跃
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then echo "未配置 Supabase，跳过"; exit 0; fi
          curl -sSf "$SUPABASE_URL/rest/v1/venues?select=id&limit=1" -H "apikey: $KEY" > /dev/null
