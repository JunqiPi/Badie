name: Supabase keep-alive

# 免费版项目 7 天没有活动会被暂停；每天读一次公开数据，保持活跃，顺便检查公开 API 能读到球馆
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then echo "未配置 Supabase，跳过"; exit 0; fi
          # 走 venues_near（球馆表不让客户端直接读，见 STATUS“防整表拿走”）：洛杉矶 50 公里内取 1 家
          body=$(curl -sSf "$SUPABASE_URL/rest/v1/rpc/venues_near" -H "apikey: $KEY" -H "Content-Type: application/json" \
            -d '{"lat": 34.0522, "lng": -118.2437, "radius_km": 50, "max_results": 1}')
          [[ "$body" == \[\{* ]] || { echo "公开 API 读不到球馆"; exit 1; }
          echo "能读到球馆"
