name: Supabase CI

on:
  push:
    branches: [ main, "claude/**" ]
    paths:
      - "supabase/**"
      - "Badie-iOS/Badie/Resources/*.json"
      - ".github/workflows/supabase.yml"
  pull_request:
    paths:
      - "supabase/**"
      - "Badie-iOS/Badie/Resources/*.json"
  workflow_dispatch:

concurrency:
  group: supabase-${{ github.ref }}
  cancel-in-progress: true

jobs:
  db-test:
    name: Migrations, lint & database tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      - name: Seed matches the venue catalogs
        run: |
          python3 supabase/scripts/build_venue_seed.py
          git diff --exit-code supabase/seed.sql || { echo "seed.sql 过期：运行 python3 supabase/scripts/build_venue_seed.py"; exit 1; }

      # 只启动数据库：迁移和 pgTAP 测试不需要其他服务
      - name: Start database
        run: supabase db start

      - name: Lint schema
        run: supabase db lint -s public --level warning --fail-on warning

      - name: Run database tests
        run: supabase test db

      # 生产库每次部署都会再执行一遍 seed.sql
      - name: Seed can be re-run
        run: psql postgresql://postgres:postgres@127.0.0.1:54322/postgres -v ON_ERROR_STOP=1 --single-transaction -q -f supabase/seed.sql
