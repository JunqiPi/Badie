name: Apple sign-in

# 开启 Apple 登录，并每月换一次网页登录用的密钥（Apple 规定最长 6 个月，Supabase 不会自动换）。
# 用 Apple 的私钥生成密钥，通过 Supabase 管理接口写进 Apple 登录的设置；同一把私钥也写进服务器函数的 Secrets：
# 注销时撤销 Apple 授权要用；没有单独的 APNs 私钥时，iPhone 推送也用它。密钥和私钥都不打印。
# 需要的 Secrets：APPLE_KEY_ID、APPLE_PRIVATE_KEY（.p8 的全部内容）、SUPABASE_CONFIG_TOKEN（只给 Auth Config 和 Edge Function Secrets
# 读写权限的 Supabase 令牌，和部署用的分开）；变量 SUPABASE_PROJECT_REF 已有。
# 步骤见 Badie-iOS/docs/DEPLOY.md 第 4.5 节
on:
  schedule:
    - cron: "23 8 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    name: Turn on Apple sign-in and refresh its secret
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APPLE_TEAM_ID: PU482V2DWN
      SERVICES_ID: com.badie.web
      BUNDLE_ID: com.badie.app
      APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_CONFIG_TOKEN }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Supabase
        env:
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
        run: |
          if [ -z "$APPLE_KEY_ID" ] || [ -z "$APPLE_PRIVATE_KEY" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then
            if [ "$GITHUB_EVENT_NAME" = schedule ]; then echo "还没配置 Apple 登录，跳过"; exit 0; fi
            echo "::error::还没设置 APPLE_KEY_ID、APPLE_PRIVATE_KEY 或 SUPABASE_CONFIG_TOKEN，见 Badie-iOS/docs/DEPLOY.md 第 4.5 节"; exit 1
          fi
          KEY_FILE="$RUNNER_TEMP/apple.p8"
          (umask 077; printf '%s\n' "$APPLE_PRIVATE_KEY" > "$KEY_FILE")
          export SECRET=$(node supabase/scripts/apple_client_secret.mjs "$APPLE_TEAM_ID" "$APPLE_KEY_ID" "$SERVICES_ID" "$KEY_FILE" 2> "$RUNNER_TEMP/expiry.txt")
          rm -f "$KEY_FILE"
          echo "::add-mask::$SECRET"
          # 调 Supabase 管理接口（请求体从标准输入读）。成功的回应里有密钥，不打印；出错只打印服务器给的说明
          call() {
            code=$(curl -sS -X "$1" "https://api.supabase.com/v1/projects/$PROJECT_REF$2" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
                     -H "Content-Type: application/json" --data @- -o "$RUNNER_TEMP/response.json" -w '%{http_code}')
            if [ "${code:0:1}" != 2 ]; then
              echo "::error::Supabase $1 $2 → HTTP $code：$(jq -r '.message // .error // empty' "$RUNNER_TEMP/response.json" 2>/dev/null | head -c 300)（401/403 多半是 SUPABASE_CONFIG_TOKEN 过期或少了权限）"
              exit 1
            fi
          }
          # Client IDs：网页的 Services ID 在前，App 的 Bundle ID 在后（顺序反了，网页登录会被 Apple 拒绝）
          jq -n '{external_apple_enabled: true, external_apple_client_id: env.SERVICES_ID,
                  external_apple_additional_client_ids: env.BUNDLE_ID, external_apple_secret: env.SECRET}' | call PATCH /config/auth
          jq -n '[{name: "APPLE_TEAM_ID", value: env.APPLE_TEAM_ID}, {name: "APPLE_KEY_ID", value: env.APPLE_KEY_ID},
                  {name: "APPLE_PRIVATE_KEY", value: env.APPLE_PRIVATE_KEY}]' | call POST /secrets
          rm -f "$RUNNER_TEMP/response.json"
          echo "### Apple 登录已开启：网页用的密钥有效到 $(grep -o '[0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}' "$RUNNER_TEMP/expiry.txt")，每月 1 日自动换新" >> "$GITHUB_STEP_SUMMARY"
